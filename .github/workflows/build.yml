name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs so a moved tag cannot change what runs.
# Dependabot keeps these up to date.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:uq-tokens
      - run: npm test
      # Electron itself ships inside the app, so dev dependencies are audited too.
      - run: npm audit

  appimage:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npx electron-builder --linux AppImage --publish never
      - name: Checksum
        run: cd dist && sha256sum *.AppImage > SHA256SUMS.txt
      # This version's CHANGELOG.md section becomes the release notes (the tests fail without one).
      - name: Release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/version.js notes "$VERSION" > dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GutCheck-AppImage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  # Releases happen two ways: pushing a v* tag, or bumping "version" in package.json on main (the
  # tag v<version> is then created for you). Either way the tests and the AppImage build must pass first.
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GutCheck-AppImage
          path: dist
      - name: Create tag and release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.appimage.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists: nothing to do."
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "branch" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on another commit: bump the version to release again."
            exit 0
          fi
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          # On a tag push the tag already exists; on main this creates it at the tested commit.
          gh release create "$TAG" dist/*.AppImage dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GutCheck $TAG" --notes-file dist/RELEASE_NOTES.md --generate-notes $FLAGS
