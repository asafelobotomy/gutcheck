<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
  <title>GutCheck</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>GutCheck</h1>
    <input id="root" type="text" placeholder="Workspace folder, e.g. ~/Projects" spellcheck="false" />
    <button id="browse">Browse…</button>
    <label class="deep" title="Also runs npm outdated per repo (slower)"><input id="deep" type="checkbox" /> Deep scan</label>
    <button id="scan" class="primary">Scan</button>
    <span id="auth" class="pill"></span>
  </header>
  <div id="progress" hidden><div id="bar"></div><span id="ptext"></span></div>
  <section id="stats"></section>
  <main>
    <aside>
      <div class="filters">
        <input id="q" type="search" placeholder="Filter repos…" />
        <select id="sort">
          <option value="score">Worst health first</option>
          <option value="name">Name</option>
          <option value="prs">Most open PRs</option>
        </select>
      </div>
      <button id="overview" class="nav">Workspace overview</button>
      <ul id="repos"></ul>
    </aside>
    <section id="detail"><p class="empty">Choose a workspace folder and press Scan.</p></section>
  </main>
  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
