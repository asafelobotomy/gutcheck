<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'" />
  <title>GutCheck</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>GutCheck</h1>
    <input id="root" type="text" placeholder="Workspace folder, e.g. ~/Projects" aria-label="Workspace folder" spellcheck="false" />
    <button id="browse">Browse…</button>
    <label class="deep" title="Also runs npm outdated per repo (slower)"><input id="deep" type="checkbox" /> Deep scan</label>
    <button id="scan" class="primary">Scan</button>
    <label class="deep" title="Disable every action; GutCheck only reads"><input id="readonly" type="checkbox" /> Read-only</label>
    <button id="history">History</button>
    <button id="background" title="AI agents, launch on start up and system tray">Settings</button>
    <span id="rate" class="pill" title="Remaining GitHub API quota"></span>
    <span id="auth" class="pill"></span>
  </header>
  <div id="progress" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" hidden><div id="bar"></div><span id="ptext"></span></div>
  <section id="stats"></section>
  <main>
    <aside>
      <div class="filters">
        <input id="q" type="search" placeholder="Filter repos…" aria-label="Filter repositories" />
        <select id="sort" aria-label="Sort repositories">
          <option value="score">Worst health first</option>
          <option value="name">Name</option>
          <option value="prs">Most open PRs</option>
        </select>
      </div>
      <button id="dashboard" class="nav">Dashboard</button>
      <button id="overview" class="nav">Workspace overview</button>
      <button id="quality" class="nav" title="File length limits, magic numbers, secrets and TODOs">Code quality</button>
      <button id="tests" class="nav" title="Missing, skipped and assertion-free tests, CI gaps, coverage and mutation testing">Tests</button>
      <button id="baseline" class="nav" title="Compare every repo with what you say each repo should have">Baseline</button>
      <button id="clutter" class="nav" title="Find stale env files, caches, duplicates and get tidy-up advice">Clutter &amp; tidy-up</button>
      <ul id="repos"></ul>
    </aside>
    <section id="detail"><p class="empty">Choose a workspace folder and press Scan.</p></section>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="metrics.js"></script>
  <script src="app.js"></script>
  <script src="modals.js"></script>
  <script src="overview-view.js"></script>
  <script src="clutter-view.js"></script>
  <script src="quality-view.js"></script>
  <script src="tests-view.js"></script>
  <script src="dashboard.js"></script>
  <script src="agents-view.js"></script>
  <script src="policy-view.js"></script>
</body>
</html>
