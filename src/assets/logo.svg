        <g fill="#e8808f" stroke="none"><circle cx="118" cy="258" r="60"/><circle cx="160" cy="306" r="70"/><circle cx="194" cy="372" r="76"/><circle cx="252" cy="386" r="70"/><circle cx="268" cy="318" r="74"/><circle cx="312" cy="246" r="62"/><circle cx="352" cy="200" r="78"/><circle cx="392" cy="138" r="64"/><circle cx="414" cy="100" r="58"/></g>
